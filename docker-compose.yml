services:
  postgres:
    image: postgres:16-alpine
    container_name: hw-1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alex
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: hw-1
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: